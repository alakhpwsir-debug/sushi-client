# Builds Sushi Client as a single portable .exe on a Windows machine.
# Trigger: push to main, or run manually from the Actions tab.
name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run launcher self-tests
        run: npm test

      - name: Build portable .exe
        run: npm run dist:win

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: SushiClient-windows
          path: dist/*.exe
